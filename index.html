    .tile.photo::after,.photo-detail-frame::after {
      z-index:3;background:#6FE7E7;
      mix-blend-mode:difference;
    }
    .tile.photo.is-film-toned img,.photo-detail-frame.is-film-toned img {
      filter:contrast(1.35) saturate(1.18) brightness(.94);
    }
    .tile.photo.is-film-toned::before,
    .tile.photo.is-film-toned::after,
    .photo-detail-frame.is-film-toned::before,
    .photo-detail-frame.is-film-toned::after { opacity:1 }
    /* Second photo click: display the selected, film-toned image in the center.
       The image itself sets the frame dimensions, so its native ratio is preserved. */
    .photo-detail-overlay { position:fixed;inset:0;z-index:6000;
      display:flex;align-items:center;justify-content:center;
      padding:clamp(18px,4vw,60px);background:rgba(0,0,0,.87);
      cursor:zoom-out;overscroll-behavior:contain;
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .22s ease,visibility .22s ease }
    .photo-detail-overlay.is-open { opacity:1;visibility:visible;pointer-events:auto }
    .photo-detail-frame { position:relative;display:inline-block;line-height:0;
      max-width:100%;max-height:100%;overflow:hidden;isolation:isolate;
      opacity:0;transform:translateY(3px) scale(.982);
      transition:opacity .21s ease-out,transform .23s cubic-bezier(.2,.7,.2,1) }
    .photo-detail-overlay.is-open .photo-detail-frame { opacity:1;transform:translateY(0) scale(1) }
    .photo-detail-frame img { display:block;width:auto;height:auto;
      max-width:min(88vw,1400px);max-height:84vh;max-height:84dvh;
      object-fit:contain;filter:none }
    @media (max-width:760px) {
      .photo-detail-frame img { max-width:92vw;max-height:80vh;max-height:80dvh }
    }
    /* Interviews stay in place: hovering changes the audio, not the collage geometry. */
    .tile.interview { cursor:default }
    .tile.interview video { background:#111;object-fit:fill }
    .tile.interview:focus-visible { outline:2px solid #111;outline-offset:3px }
    .instructions { position:absolute;z-index:4000;bottom:clamp(18px,3vw,40px);
      left:clamp(18px,3vw,40px);pointer-events:none;
      font-size:10px;letter-spacing:.18em;color:#fff;mix-blend-mode:difference }
    /* Social profiles use standalone logos; MORE is unboxed underlined text. */
    .social-links { position:absolute;z-index:2001;
      right:clamp(18px,3vw,40px);bottom:calc(clamp(18px,3vw,40px) - 12px);
      display:flex;align-items:center;gap:8px }
    .social-link { display:grid;place-items:center;width:38px;height:36px;
      padding:0;border:0;background:none;color:#fff;text-decoration:none;
      opacity:.48;-webkit-tap-highlight-color:transparent;
      transition:opacity .2s ease }
    .social-link svg { width:21px;height:21px;display:block;fill:none;
      stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round }
    .social-link:hover,.social-link:focus-visible,.social-link:active { opacity:1 }
    .social-link:focus-visible { outline:2px solid #fff;outline-offset:2px }
    /* MORE is plain underlined text, without a button box or fill. */
    .more-button { display:grid;place-items:center;width:auto;min-width:0;height:36px;
      padding:0;border:0;background:transparent;color:#fff;opacity:.5;
      font-size:11px;font-weight:400;letter-spacing:.12em;line-height:1;white-space:nowrap;
      text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:.5px;
      -webkit-tap-highlight-color:transparent;transition:opacity .2s ease }
    .more-button:hover,.more-button:focus-visible,.more-button:active { opacity:1 }
    .more-button:focus-visible { outline:2px solid #fff;outline-offset:4px }
    /* Credits-only overlay; the three platform icons keep their direct links. */
    .credits-overlay { position:fixed;inset:0;z-index:5000;display:flex;
      align-items:center;justify-content:center;padding:32px;
      background:rgba(0,0,0,.77);color:#fff;cursor:pointer;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .35s ease,visibility .35s ease }
    .credits-overlay.is-open { opacity:1;visibility:visible;pointer-events:auto }
    .credits-content { text-align:center;color:rgba(255,255,255,.88);
      font-size:clamp(12px,1.1vw,15px);line-height:1.65;letter-spacing:.025em;
      max-width:90vw }
    .credits-content p { margin:0 }
    .credits-content p:first-child { margin-bottom:12px;color:#fff }
    .asset-warning { position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);
      max-width:min(88vw,510px);padding:18px 22px;text-align:center;
      font-size:12px;line-height:1.9;color:#555;background:#fff;border:1px solid #eee }
    .asset-warning code { font-family:monospace;color:#222 }

    @media (max-width:760px) {
      .entry-title { font-size:clamp(28px,8vw,52px) }
      .instructions { font-size:9px;max-width:56% }
      .social-links { gap:7px;bottom:calc(clamp(18px,3vw,40px) - 11px) }
      .social-link { width:36px;height:34px }
      .more-button { min-width:0;height:34px;padding:0;font-size:10px }
      .credits-content { font-size:11px;line-height:1.6 }

    }
    @media (prefers-reduced-motion: reduce) {
      .entry,.experience,.tile,.social-link,.more-button,.credits-overlay,.tile.photo img,.tile.photo::before,.tile.photo::after,.photo-detail-overlay,.photo-detail-frame,.photo-detail-frame img,.photo-detail-frame::before,.photo-detail-frame::after { transition:none!important }
      .entry-center::after { animation:none;opacity:0 }
    }
  </style>

  <script>
  (() => {
    'use strict';
    const get = id => document.getElementById(id);
    const entry = get('entry'), title = get('rosesTitle'), enter = get('enter');
    const experience = get('experience'), viewport = get('viewport'), stage = get('stage');
    const soundtrack = get('soundtrack');
    const assetWarning = get('assetWarning');
    const moreButton=get('moreButton'),creditsOverlay=get('creditsOverlay');
    const photoDetailOverlay=get('photoDetailOverlay');
    const photoDetailImage=get('photoDetailImage');
    let photoDetailOpen=false,photoDetailFocusReturn=null,photoDetailHideTimer=null;
    function openPhotoDetail(item){
      if(!entered || creditsOpen || photoDetailOpen)return;
      if(photoDetailHideTimer!==null){clearTimeout(photoDetailHideTimer);photoDetailHideTimer=null;}
      photoDetailFocusReturn=visible.get(item.id) || null;
      heldArrows.clear();stopPreview();
      viewport.inert=true;
      photoDetailImage.src=item.src;
      photoDetailOverlay.hidden=false;
      photoDetailOverlay.setAttribute('aria-hidden','false');
      photoDetailOpen=true;
      // Allow the hidden state to paint before easing the image into view.
      void photoDetailOverlay.offsetWidth;
      photoDetailOverlay.classList.add('is-open');
      photoDetailOverlay.focus({preventScroll:true});
    }
    function closePhotoDetail(){
      if(!photoDetailOpen)return;
      photoDetailOpen=false;
      photoDetailOverlay.classList.remove('is-open');
      photoDetailOverlay.setAttribute('aria-hidden','true');
      viewport.inert=false;
      const restore=photoDetailFocusReturn?.isConnected ? photoDetailFocusReturn : viewport;
      photoDetailFocusReturn=null;
      restore.focus({preventScroll:true});
      // Keep the photo mounted until the brief fade-out finishes.
      const hide=()=>{
        if(!photoDetailOpen){photoDetailOverlay.hidden=true;photoDetailImage.removeAttribute('src');}
        photoDetailHideTimer=null;
      };
      if(prefersLessMotion)hide();
      else photoDetailHideTimer=setTimeout(hide,235);
    }
    photoDetailOverlay.addEventListener('click',closePhotoDetail);
    photoDetailOverlay.addEventListener('keydown',e=>{
      if(e.key==='Tab'){e.preventDefault();photoDetailOverlay.focus({preventScroll:true});}
    });
    let creditsOpen=false,creditsHideTimer=null;
    function openCredits(){
      if(!entered||creditsOpen)return;
      if(creditsHideTimer!==null){clearTimeout(creditsHideTimer);creditsHideTimer=null;}
      creditsOpen=true;heldArrows.clear();stopPreview();
      viewport.inert=true;
      moreButton.setAttribute('aria-expanded','true');
      creditsOverlay.hidden=false;creditsOverlay.setAttribute('aria-hidden','false');
      requestAnimationFrame(()=>{creditsOverlay.classList.add('is-open');creditsOverlay.focus({preventScroll:true});});
    }
    function closeCredits(){
      if(!creditsOpen)return;
      creditsOpen=false;creditsOverlay.classList.remove('is-open');
      creditsOverlay.setAttribute('aria-hidden','true');
      moreButton.setAttribute('aria-expanded','false');
      viewport.inert=false;moreButton.focus({preventScroll:true});
      creditsHideTimer=setTimeout(()=>{if(!creditsOpen)creditsOverlay.hidden=true;creditsHideTimer=null;},380);
    }
    moreButton.addEventListener('click',openCredits);
    creditsOverlay.addEventListener('click',closeCredits); // Click anywhere to dismiss credits.
    creditsOverlay.addEventListener('keydown',e=>{
      if(e.key==='Tab'){e.preventDefault();creditsOverlay.focus({preventScroll:true});}
    });
    const prefersLessMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
    const MUSIC_VOLUME = 0.85;
    const DUCKED_VOLUME = 0.08; // Roses stays quietly underneath an interview.
    const INTERVIEW_VOLUME = 1;

    const custom = window.ROSES_MEDIA || {};
    const photos = Array.isArray(custom.images) && custom.images.length
      ? custom.images : Array.from({length:120},(_,i)=>`Frame-${i+1}.jpeg`);
    const interviews = Array.isArray(custom.videos) && custom.videos.length
      ? custom.videos : Array.from({length:13},(_,i)=>`interview${i+1}.mp4`);
    const assetPath = (folder,name) => (/^(https?:|data:|\/)/i.test(name) || name.startsWith('assets/'))
      ? name : `assets/${folder}/${name.split('/').map(encodeURIComponent).join('/')}`;

    // Asset shuffling is repeatable per strip, while each new strip is different.
    function seededRandom(seed) {
      let t = seed >>> 0;
      return () => {
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ (t >>> 15), 1 | t);
        r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
        return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
      };
    }
    function shuffleStable(list, seed) {
      const arr = list.slice();
      const rand = seededRandom(seed);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    const allMedia = [
      ...photos.map((name,i)=>({type:'image',src:assetPath('images',name),name,number:i+1})),
      ...interviews.map((name,i)=>({type:'video',src:assetPath('videos',name),name,number:i+1}))
    ];
    // Each reload also changes the seed for newly generated gallery strips.
    const sessionSeed = (() => {
      if (globalThis.crypto?.getRandomValues) {
        const values=new Uint32Array(1);crypto.getRandomValues(values);return values[0];
      }
      return Math.floor(Math.random()*0x100000000);
    })();
    const media = shuffleStable(allMedia,sessionSeed);
    media.forEach((item,i)=>{ item.id=i; });

    // Latest official SG Rhizoma Engine: full-screen field + continuous climb
    // Source: https://sativus-gourd.github.io/rhizoma-smoke/
    let entered=false, rhizoma=null, rhizomaStarted=false;
    function initRhizoma() {
      if(entered || rhizomaStarted || typeof window.SGRhizoma?.grow!=='function')return;
      rhizomaStarted=true;
      try {
        rhizoma=window.SGRhizoma.grow(title, {
          face:'roses',seed:202,field:true,fixed:true,size:.30,
          climb:20,seconds:42,colour:'#ffffff',weight:'earthy',dpr:2
        });
      } catch(err) {
        rhizomaStarted=false;
        console.warn('Rhizoma engine failed, showing plain ROSES text:',err);
      }
    }
    function waitForRhizoma(attempts=0) {
      if(entered || rhizomaStarted)return;
      if(typeof window.SGRhizoma?.grow==='function')initRhizoma();
      else if(attempts<80)setTimeout(()=>waitForRhizoma(attempts+1),100);
    }
    if(document.readyState==='loading')
      document.addEventListener('DOMContentLoaded',()=>waitForRhizoma(),{once:true});
    else waitForRhizoma();

    // Infinite, non-repeating collage: each strip has its own seeded arrangement.
    // Strip metadata stays small; only the nearby strips keep their tile geometry.
    let camera=0,target=0,visible=new Map();
    let strips=new Map(),minStrip=0,maxStrip=0;
    let previousTime=0,pressed=null,draggedRecently=0,activePreview=null;
    // Bottom-to-top order of all image and video tiles. Clicking moves only that tile to the end.
    let stackOrder=[];
    let resumeMusicAfterPreview=false;
    let backgroundVolumeTarget=MUSIC_VOLUME, audioLastTime=0;
    const heldArrows=new Set();
    let brokenImages=0,loadedImages=0;
    // A missing or unplayable file should not leave a visible empty tile.
    // Remove it from the source list and repack the mosaic with valid media.
    const missingSources=new Set();
    function removeMissingMedia(source){
      const src=typeof source==='string' ? source : source.src;
      if(missingSources.has(src))return;
      missingSources.add(src);
      for(const [id,tile] of visible){
        if(tile.dataset.source!==src)continue;
        if(tile===activePreview)stopPreview(tile);
        tile.remove();visible.delete(id);
      }
      scheduleBackgroundRelayout();
    }

    // Each newly encountered strip uses the same media in a fresh composition.
    // Deterministic strip seeds also let the user scroll back to a familiar arrangement.
    function randomFor(n, salt=0) {
      let t=(n + 1) * 0x9E3779B1 + (salt + 11) * 0x85EBCA77;
      t=Math.imul(t ^ (t >>> 16), 0x7FEB352D);
      t=Math.imul(t ^ (t >>> 15), 0x846CA68B);
      return ((t ^ (t >>> 16)) >>> 0) / 4294967296;
    }
    function seedForStrip(index){
      return (sessionSeed ^ Math.imul(index,0x9E3779B1))>>>0;
    }
    // A gap-free freeform photo mosaic: nested horizontal and vertical cuts.
    // Each cut is sized from the photographs' REAL aspect ratios, so no tile
    // needs to crop, stretch, or leave a coloured letterbox behind it.
    function createFreeformTree(photos, salt, depth=0){
      if(photos.length===1){
        const item=photos[0];
        const ratio=mediaRatios.get(item.src)||1.25;
        return {item,ratio:Math.max(.08,Math.min(16,ratio))};
      }
      const n=photos.length;
      const fraction=.31+randomFor(salt+depth*13,304)*.38;
      const cut=Math.max(1,Math.min(n-1,Math.round(n*fraction)));
      const a=createFreeformTree(photos.slice(0,cut),salt*3+7,depth+1);
      const b=createFreeformTree(photos.slice(cut),salt*3+11,depth+1);
      // Side by side: width/height ratios add.
      const sideRatio=a.ratio+b.ratio;
      // One above the other: inverse ratios add.
      const stackRatio=a.ratio*b.ratio/(a.ratio+b.ratio);
      const desired=.75+randomFor(salt,301)*.95;
      const irregularity=(randomFor(salt,303)-.5)*1.2;
      const sideScore=Math.abs(Math.log(sideRatio/desired))+irregularity;
      const stackScore=Math.abs(Math.log(stackRatio/desired));
      const axis=sideScore<stackScore?'side':'stack';
      return {a,b,axis,ratio:axis==='side'?sideRatio:stackRatio};
    }
    function layOutFreeformTree(node,x,y,w,h,out,stripIndex){
      if(node.item){
        const item=node.item;
        out.push({...item,id:`${stripIndex}:${item.id}`,stripIndex,
          x,width:w,y:y+h/2,height:h,layer:1});
        return;
      }
      if(node.axis==='side'){
        const split=h*node.a.ratio;
        layOutFreeformTree(node.a,x,y,split,h,out,stripIndex);
        layOutFreeformTree(node.b,x+split,y,w-split,h,out,stripIndex);
      }else{
        const split=w/node.a.ratio;
        layOutFreeformTree(node.a,x,y,w,split,out,stripIndex);
        layOutFreeformTree(node.b,x,y+split,w,h-split,out,stripIndex);
      }
    }
    function freeformBlock(photos,blockId,vH,stripIndex){
      // Try a few seeded compositions and choose one with a varied rhythm,
      // rather than very thin slivers or unexpectedly huge background photos.
      // Allow narrow, wide and almost-square clusters, instead of repeating
      // similarly sized full-height mosaic columns.
      const desiredRatio=.82+randomFor(blockId,409)*.92;
      let winner=null;
      for(let attempt=0;attempt<13;attempt++){
        const tree=createFreeformTree(photos,blockId*109+attempt*17+1);
        const width=tree.ratio*vH;
        const cells=[];
        layOutFreeformTree(tree,0,0,width,vH,cells,stripIndex);
        let penalty=Math.abs(Math.log(Math.max(.001,tree.ratio)/desiredRatio))*2;
        for(const cell of cells){
          const small=Math.min(cell.width,cell.height);
          const large=Math.max(cell.width,cell.height);
          penalty+=Math.max(0,vH*.105-small)/(vH*.105)*.7;
          penalty+=Math.max(0,large-vH*.57)/vH*.9;
        }
        penalty+=Math.max(0,tree.ratio-1.85)*2+Math.max(0,.55-tree.ratio)*2;
        if(!winner || penalty<winner.penalty)winner={penalty,width,cells};
      }
      return winner;
    }
    function buildStrip(index){
      const vW=innerWidth, vH=innerHeight;
      const isMobile=vW<=760;
      const stripSeed=seedForStrip(index);
      // Keep the original first-screen selection. Every further strip reshuffles it.
      const available=media.filter(item=>!missingSources.has(item.src));
      const arranged=index===0 ? available : shuffleStable(available,stripSeed);
      const allPhotos=arranged.filter(item=>item.type==='image');
      const allVideos=arranged.filter(item=>item.type==='video');
      const baseCount=Math.min(96,Math.round(allPhotos.length*.8));
      const background=allPhotos.slice(0,baseCount);
      const foreground=shuffleStable([...allPhotos.slice(baseCount),...allVideos],
        stripSeed ^ 0xB84FA921);
      // Occasionally use one of the background photos as a large picture behind
      // the foreground collage. It is NOT repeated in the small-photo mosaic.
      // The seeded choice stays the same when scrolling back or resizing.
      // One large feature every 2–3 strips (never back-to-back): within each
      // five-strip group, feature the first strip and randomly the third or
      // fourth. The placement is seeded, so scrolling back restores it.
      const featureGroup=Math.floor(index/5);
      const featureOffset=2+Math.floor(randomFor(featureGroup,913)*2);
      const showLargePhoto=background.length>1 &&
        (index===featureGroup*5 || index===featureGroup*5+featureOffset);
      const largePhoto=showLargePhoto
        ? background.splice(Math.floor(randomFor(index,914)*background.length),1)[0]
        : null;
      const next=[];
      let columnX=0,photoIndex=0,blockIndex=0;
      while(photoIndex<background.length){
        // Each cluster has a different number of photos and a different shape.
        // Its irregular subdivisions become a dense UNDERLAYER. The photos
        // overhang their cells slightly to hide rigid seams between clusters.
        const remaining=background.length-photoIndex;
        let count=Math.min(remaining,12+Math.floor(randomFor(
          blockIndex+index*1019,381)*14));
        if(remaining-count<5)count=remaining;
        const group=background.slice(photoIndex,photoIndex+count);
        const block=freeformBlock(group,blockIndex+index*1019,vH,index);
        for(let k=0;k<block.cells.length;k++){
          const cell=block.cells[k];
          const tileSeed=index*7919+photoIndex+k*173;
          // Every enlarged rectangle fully contains its original mosaic cell,
          // so there are no gaps. Both dimensions scale equally: ZERO cropping
          // or distortion is introduced by the overlap effect.
          const size=Math.max(cell.width,cell.height);
          const maxScale=size>vH*.55 ? .135 : .235;
          const scale=1.075+Math.pow(randomFor(tileSeed,501),.85)*maxScale;
          const w=cell.width*scale,h=cell.height*scale;
          const overX=(w-cell.width)/2,overY=(h-cell.height)/2;
          // Limited, independent nudges break continuous grid edges while
          // retaining complete coverage of the original background rectangle.
          const jitterX=(randomFor(tileSeed,502)*2-1)*overX*.78;
          const jitterY=(randomFor(tileSeed,503)*2-1)*overY*.78;
          next.push({...cell,
            x:cell.x+columnX-overX+jitterX,
            y:cell.y+jitterY,
            width:w,height:h,
            layer:1+Math.floor(randomFor(tileSeed,504)*2)});
        }
        columnX+=block.width;
        photoIndex+=count;
        blockIndex++;
      }
      const width=Math.max(1,columnX);
      // The occasional large image sits ABOVE the small background mosaic but
      // BELOW every regular foreground photo and interview video (layer 3 vs 10+).
      // Its whole source image is shown at its native aspect ratio, not cropped.
      if(largePhoto){
        const ratio=Math.max(.25,Math.min(4,mediaRatios.get(largePhoto.src)||1.25));
        let featureHeight=vH*(.72+randomFor(index,915)*.13);
        let featureWidth=featureHeight*ratio;
        const maxFeatureWidth=Math.min(width*.72,vW*.93);
        if(featureWidth>maxFeatureWidth){
          featureHeight*=maxFeatureWidth/featureWidth;
          featureWidth=maxFeatureWidth;
        }
        const x=Math.max(0,Math.min(width-featureWidth,
          width*(index===0 ? (.025+randomFor(index,916)*.09)
                           : (.10+randomFor(index,916)*.75))));
        const y=featureHeight/2+randomFor(index,917)*Math.max(0,vH-featureHeight);
        next.push({...largePhoto,id:`${index}:${largePhoto.id}`,stripIndex:index,
          x,width:featureWidth,height:featureHeight,y,layer:3});
        ensureBackgroundRatio(largePhoto.src);
      }
      // Load real photo dimensions once per source. The strip is repacked when
      // necessary, without modifying the source aspect ratios.
      background.forEach(item=>ensureBackgroundRatio(item.src));
      // Uneven foreground spacing, with a little extra horizontal wandering.
      // These pieces sit above the loosely interleaved background mosaic.
      const foregroundGaps=foreground.map((item,i)=>
        .24+Math.pow(randomFor(i+index*1019,201),1.85)*2.15);
      const totalGaps=foregroundGaps.reduce((a,b)=>a+b,0)||1;
      let foregroundCursor=0;
      foreground.forEach((item,i)=>{
        const noiseIndex=i+index*1019;
        const baseX=(foregroundCursor+.5*foregroundGaps[i])/totalGaps*width;
        foregroundCursor+=foregroundGaps[i];
        const slotWidth=isMobile
          ? Math.min(vW*.75,185+randomFor(noiseIndex,203)*Math.min(130,vW*.24))
          : Math.max(250,Math.min(610,vH*(.28+randomFor(noiseIndex,203)*.38)));
        const slotHeight=isMobile
          ? Math.min(vH*.52,200+randomFor(noiseIndex,209)*190)
          : Math.max(190,Math.min(vH*.60,vH*(.27+randomFor(noiseIndex,209)*.35)));
        const mediaScale=item.type==='image' ? .48 : .741;
        const itemWidth=slotWidth*mediaScale,itemHeight=slotHeight*mediaScale;
        // Shift each photo within its local neighbourhood rather than
        // aligning every photo on an implicit horizontal cadence.
        const x=Math.max(-itemWidth*.12,Math.min(width-itemWidth*.1,
          baseX+(randomFor(noiseIndex,511)*2-1)*itemWidth*.28));
        const y=itemHeight/2+randomFor(noiseIndex,207)*Math.max(0,vH-itemHeight);
        next.push({...item,id:`${index}:${item.id}`,stripIndex:index,
          x,width:itemWidth,height:itemHeight,y,
          layer:item.type==='video' ? 25+Math.floor(randomFor(noiseIndex,213)*5)
                                    : 10+Math.floor(randomFor(noiseIndex,213)*10)});
      });
      return {index,start:0,width,items:next};
    }
    function findCurrentStrip(position){
      for(const strip of strips.values()){
        if(position>=strip.start && position<strip.start+strip.width)return strip;
      }
      return strips.get(position<0?minStrip:maxStrip) || null;
    }
    function ensureStrips(from,to){
      if(!strips.size){
        const initial=buildStrip(0);
        strips.set(0,initial);minStrip=0;maxStrip=0;
      }
      let last=strips.get(maxStrip);
      while(last.start+last.width<to){
        const next=buildStrip(maxStrip+1);
        next.start=last.start+last.width;
        strips.set(next.index,next);maxStrip=next.index;last=next;
      }
      let first=strips.get(minStrip);
      while(first.start>from){
        const previous=buildStrip(minStrip-1);
        previous.start=first.start-previous.width;
        strips.set(previous.index,previous);minStrip=previous.index;first=previous;
      }
      // Retain each strip's start/width for stable reverse scrolling, but discard
      // far-off tile geometry to keep memory bounded during long explorations.
      const keepDistance=Math.max(innerWidth*3,1800);
      for(const strip of strips.values()){
        if(strip.start+strip.width<from-keepDistance || strip.start>to+keepDistance)
          strip.items=null;
      }
    }
    function layout(){
      // Preserve the current strip and the viewer's position within it on
      // resize, initial photo-dimension discovery, or removal of broken media.
      const previous=findCurrentStrip(camera);
      const anchorIndex=previous?.index ?? 0;
      const fraction=previous ? Math.max(0,Math.min(1,
        (camera-previous.start)/Math.max(1,previous.width))) : 0;
      const anchor=buildStrip(anchorIndex);
      anchor.start=camera-fraction*anchor.width;
      strips=new Map([[anchorIndex,anchor]]);
      minStrip=anchorIndex;maxStrip=anchorIndex;
      // The old DOM is removed; click order is retained for the nearby strips.
      visible.forEach(el=>el.remove());visible.clear();
      placeVisible();
      if(!entered)preloadFirstScreen();
    }
    // Background and foreground photographs both preserve native aspect ratios.
    const mediaRatios=new Map();
    const pendingBackgroundRatios=new Set();
    let backgroundRelayoutTimer=null;
    function scheduleBackgroundRelayout(){
      clearTimeout(backgroundRelayoutTimer);
      backgroundRelayoutTimer=setTimeout(()=>{
        backgroundRelayoutTimer=null;
        // Keep the visitor in the same strip, even after photos are repacked.
        layout();
      },180);
    }
    function ensureBackgroundRatio(src){
      if(missingSources.has(src)||mediaRatios.has(src)||pendingBackgroundRatios.has(src))return;
      pendingBackgroundRatios.add(src);
      const img=new Image();
      img.decoding='async';
      img.onload=()=>{
        pendingBackgroundRatios.delete(src);
        if(img.naturalHeight>0){
          const measured=img.naturalWidth/img.naturalHeight;
          const previous=mediaRatios.get(src);
          mediaRatios.set(src,measured);
          if(!previous || Math.abs(previous-measured)>0.0001)
            scheduleBackgroundRelayout();
        }
      };
      img.onerror=()=>{pendingBackgroundRatios.delete(src);removeMissingMedia(src);};
      img.src=src;
    }
    const preloadedFirstScreen=new Set();
    function preloadFirstScreen() {
      const candidates=[];
      for(const strip of strips.values()){
        if(strip.start>innerWidth*1.12 || strip.start+strip.width<0)continue;
        for(const item of strip.items||[]){
          if(item.type==='image' && strip.start+item.x<innerWidth*1.12 &&
             strip.start+item.x+item.width>=0)candidates.push(item);
        }
      }
      for(const item of candidates.slice(0,28)) {
        if(preloadedFirstScreen.has(item.src))continue;
        preloadedFirstScreen.add(item.src);
        const img=new Image();img.decoding='async';img.onload=()=>{
          if(img.naturalHeight){
            mediaRatios.set(item.src,img.naturalWidth/img.naturalHeight);
            if(entered)placeVisible();
          }
        };
        img.onerror=()=>removeMissingMedia(item);
        img.src=item.src;
      }
    }
    function placeVisible() {
      // No modulo/wrap: new seeded mosaics are created beyond both ends.
      // Each strip is stable when returning to an earlier section.
      const buffer=Math.min(520,innerWidth*.46);
      ensureStrips(camera-buffer,camera+innerWidth+buffer);
      const keep=new Set(),nearby=[];
      for(const strip of strips.values()){
        if(strip.start+strip.width<camera-buffer ||
           strip.start>camera+innerWidth+buffer)continue;
        if(!strip.items)strip.items=buildStrip(strip.index).items;
        for(const item of strip.items){
          if(missingSources.has(item.src))continue;
          const left=strip.start+item.x-camera;
          if(left+item.width< -buffer || left>innerWidth+buffer)continue;
          nearby.push({item,left});
        }
      }
      // New segments join the common stacking order without disrupting clicks.
      const nearbyByLayer=nearby.map(({item},i)=>({...item,paintIndex:i}))
        .sort((a,b)=>a.layer-b.layer || a.paintIndex-b.paintIndex).map(item=>item.id);
      const availableIds=new Set(nearbyByLayer);
      const previouslyStacked=new Set(stackOrder);
      stackOrder=[...nearbyByLayer.filter(id=>!previouslyStacked.has(id)),
                  ...stackOrder.filter(id=>availableIds.has(id))];
      for(const {item,left} of nearby){
        keep.add(item.id);
        let el=visible.get(item.id);
        if(!el){el=makeTile(item);visible.set(item.id,el);stage.appendChild(el);}
        let displayWidth=item.width,displayHeight=item.height;
        const ratio=mediaRatios.get(item.src);
        if(ratio>0 && item.type==='image'){
          if(item.layer>2){
            // Foreground photo fits inside its slot without cropping.
            if(displayWidth/displayHeight>ratio)displayWidth=displayHeight*ratio;
            else displayHeight=displayWidth/ratio;
          }
          // Mosaic backgrounds are already packed to intrinsic ratios.
        } else if(ratio>0 && item.type==='video'){
          if(displayWidth/displayHeight<ratio)displayWidth=displayHeight*ratio;
          else displayHeight=displayWidth/ratio;
        }
        let centerY=item.y;
        if(item.type==='image'){
          const halfHeight=displayHeight/2;
          centerY=Math.max(halfHeight,Math.min(innerHeight-halfHeight,centerY));
        }
        el.style.left=(left+(item.width-displayWidth)/2)+'px';
        el.style.top=centerY+'px';
        el.style.width=displayWidth+'px';
        el.style.height=displayHeight+'px';
        el.style.zIndex=String(stackOrder.indexOf(item.id)+1);
        if(item.type==='image'){
          // Film colour is selected ONLY by click. Keep it independent of
          // hover, image loading and the periodic infinite-scroll relayout.
          el.classList.toggle('is-film-toned',filmTonedItems.has(item.id));
          const image=el.querySelector('img');
          const hasDimensions=Boolean(image?.complete && image.naturalWidth && image.naturalHeight);
          const actualRatio=hasDimensions ? image.naturalWidth/image.naturalHeight : 0;
          const exactFit=actualRatio>0 &&
            Math.abs(displayWidth/displayHeight-actualRatio)<0.003;
          el.classList.toggle('is-loaded',hasDimensions && exactFit);
        }
      }
      for(const [id,el] of visible){
        if(keep.has(id))continue;
        if(el===activePreview)stopPreview();
        el.remove();visible.delete(id);
      }
    }
    // First click: keep the film-tone and move the photo to the front.
    // Second (and subsequent) clicks: show the enlarged, film-toned photo.
    // The film state persists when the infinite-scroll tile leaves and returns.
    const filmTonedItems=new Set();
    function activateTile(item){
      if(!entered || creditsOpen || photoDetailOpen || pressed?.drag ||
         performance.now()-draggedRecently<330)return;
      if(item.type==='image' && filmTonedItems.has(item.id)){
        openPhotoDetail(item);
        return;
      }
      bringTileToFront(item);
      if(item.type!=='image')return;
      filmTonedItems.add(item.id);
      const tile=visible.get(item.id);
      if(tile)tile.classList.add('is-film-toned');
    }
    function bringTileToFront(item) {
      if(!entered || creditsOpen || pressed?.drag || performance.now()-draggedRecently<330)return;
      const index=stackOrder.indexOf(item.id);
      if(index<0 || index===stackOrder.length-1)return;
      // 1,2,3 -> click 1 -> 2,3,1 -> click 2 -> 3,1,2
      // No other tile changes its position relative to its neighbors.
      stackOrder.splice(index,1);
      stackOrder.push(item.id);
      stackOrder.forEach((id,i)=>{
        const el=visible.get(id);
        if(el)el.style.zIndex=String(i+1);
      });
    }
    function makeTile(item) {
      const tile=document.createElement('div');
      tile.className='tile '+(item.type==='video'?'interview':'photo');
      if(item.type==='image' && item.layer<=2)tile.classList.add('base-photo');
      if(item.type==='image' && filmTonedItems.has(item.id))tile.classList.add('is-film-toned');
      if(item.type==='image')tile.tabIndex=0;
      if(item.type==='video') tile.tabIndex=0;
      tile.dataset.id=item.id;
      tile.dataset.source=item.src;
      if(item.type==='video')tile.setAttribute('aria-label',
        `Interview ${item.number}. ${canHover?'Hover or focus':'Tap'} to listen.`);
      tile.style.zIndex=String(stackOrder.indexOf(item.id)+1);
      if(item.type==='image') {
        const image=document.createElement('img');
        image.loading='eager';image.decoding='async';image.draggable=false;image.alt='';
        if(item.x<innerWidth*1.1)image.fetchPriority='high';
        image.src=item.src;
        image.onload=()=>{
          loadedImages++;
          // A few broken sources should never leave a stale missing-assets warning.
          assetWarning.hidden=true;
          if(image.naturalHeight){
            const ratio=image.naturalWidth/image.naturalHeight;
            const previous=mediaRatios.get(item.src);
            mediaRatios.set(item.src,ratio);
            if(item.layer<=2 && (!previous || Math.abs(previous-ratio)>0.0001))
              scheduleBackgroundRelayout();
            else placeVisible();
          }
        };
        image.onerror=()=>{
          brokenImages++;
          removeMissingMedia(item);
          maybeWarn();
        };
        tile.append(image);
        // Keep Enter and Space keyboard activation for photos.
        tile.addEventListener('keydown',e=>{
          if(e.key==='Enter' || e.key===' '){
            e.preventDefault();e.stopPropagation();
            activateTile(item);
          }
        });
      } else {
        const video=document.createElement('video');
        video.src=item.src;video.muted=true;video.defaultMuted=true;video.loop=true;
        video.playsInline=true;video.setAttribute('playsinline','');video.preload='metadata';
        video.setAttribute('aria-hidden','true');
        // Show a still frame even before the visitor hovers to play.
        video.addEventListener('loadedmetadata',()=>{
          if(video.videoHeight)mediaRatios.set(item.src,video.videoWidth/video.videoHeight);
          if(Number.isFinite(video.duration) && video.duration > .15){
            try{video.currentTime=Math.min(.15,video.duration*.08)}catch{}
          }
        },{once:true});
        video.addEventListener('error',()=>{
          removeMissingMedia(item);
        });
        tile.append(video);
        if(canHover){
          tile.addEventListener('pointerenter',()=>startPreview(tile));
          tile.addEventListener('pointerleave',()=>stopPreview(tile));
          // Keyboard users can listen on focus; no interview click or modal action.
          tile.addEventListener('focus',()=>startPreview(tile));
          tile.addEventListener('blur',()=>stopPreview(tile));
        } else {
          // Touchscreens have no hover. Tapping toggles playback in the tile,
          // never opens a fullscreen player.
          tile.addEventListener('pointerup',()=>{
            if(pressed?.drag || performance.now()-draggedRecently<330)return;
            if(activePreview===tile)stopPreview(tile);
            else startPreview(tile);
          });
        }
      }
      // Both photographs and interviews come forward on click, in actual click order.
      // Movement gestures are filtered by bringTileToFront to avoid accidental selection.
      tile.addEventListener('click',()=>activateTile(item));
      if(item.type==='video'){
        tile.addEventListener('keydown',e=>{
          if(e.key==='Enter'){
            e.preventDefault();e.stopPropagation();
            activateTile(item);
          }
        });
      }
      return tile;
    }
    function maybeWarn(){
      if(brokenImages>=3 && loadedImages===0 && !custom.images){
        assetWarning.innerHTML='이미지를 찾지 못했어요.<br><code>assets/images/Frame-1.jpeg</code> 부터 확인해 주세요.<br>파일명이 다르면 <code>assets/manifest.js</code> 에 실제 파일명을 지정하면 됩니다.';
        assetWarning.hidden=false;
      }
    }
    function tick(t) {
      const dt=Math.min(3, (t-previousTime)/16.67||1);previousTime=t;
      camera+=(target-camera)*(1-Math.pow(.83,dt));
      // Arrow keys move smoothly while held.
      if(entered && heldArrows.size){
        const direction=(heldArrows.has('ArrowRight')?1:0)-(heldArrows.has('ArrowLeft')?1:0);
        if(direction)move(direction*12*dt);
      }
      if(entered)placeVisible();
      // Audio ducking: ~0.6s fade-down / ~0.9s recovery, with no abrupt cuts.
      // Frame-rate independent smoothing follows a new hover target immediately.
      const elapsedMs=Math.min(80, Math.max(0,(t-(audioLastTime||t))));
      audioLastTime=t;
      const fadeMs=backgroundVolumeTarget<soundtrack.volume?250:380;
      const f=1-Math.exp(-elapsedMs/fadeMs);
      soundtrack.volume += (backgroundVolumeTarget-soundtrack.volume)*f;
      if(Math.abs(soundtrack.volume-backgroundVolumeTarget)<.002)
        soundtrack.volume=backgroundVolumeTarget;
      if(activePreview){
        const video=activePreview.querySelector('video');
        if(video){
          const vf=1-Math.exp(-elapsedMs/170);
          video.volume=Math.min(INTERVIEW_VOLUME,video.volume+(INTERVIEW_VOLUME-video.volume)*vf);
        }
      }
      requestAnimationFrame(tick);
    }
    function move(delta){target+=delta;}
    viewport.addEventListener('wheel',e=>{
      if(!entered)return;e.preventDefault();
      const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
      move(d*(e.deltaMode===1?25:1.05));
    },{passive:false});
    viewport.addEventListener('pointerdown',e=>{
      if(!entered||(e.pointerType==='mouse'&&e.button!==0))return;
      pressed={id:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,drag:false};
    });
    viewport.addEventListener('pointermove',e=>{
      if(!pressed||pressed.id!==e.pointerId)return;
      const dx=e.clientX-pressed.lastX,dy=e.clientY-pressed.lastY;
      if(!pressed.drag && Math.hypot(e.clientX-pressed.x,e.clientY-pressed.y)>8){
        pressed.drag=true;viewport.classList.add('dragging');
        try{viewport.setPointerCapture(e.pointerId)}catch{}
        stopPreview(false);
      }
      if(pressed.drag)move(Math.abs(dx)>Math.abs(dy)?-dx:-dy);
      pressed.lastX=e.clientX;pressed.lastY=e.clientY;
    });
    function releasePointer(e){
      if(!pressed||e.pointerId!==pressed.id)return;
      if(pressed.drag)draggedRecently=performance.now();
      pressed=null;viewport.classList.remove('dragging');
      try{if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId)}catch{}
    }
    viewport.addEventListener('pointerup',releasePointer);
    viewport.addEventListener('pointercancel',releasePointer);

    // Hover gradually ducks the Roses soundtrack instead of pausing it.
    // The interview fades in and plays at its original size; leaving restores
    // the soundtrack smoothly at its current playback position.
    // Safari may reject unmuted hover autoplay: then return to Roses volume.
    function startPreview(tile){
      if(!entered||pressed?.drag||activePreview===tile)return;
      if(activePreview)stopPreview(activePreview,false);
      const video=tile.querySelector('video');if(!video)return;
      activePreview=tile;
      resumeMusicAfterPreview=!soundtrack.paused;
      backgroundVolumeTarget=DUCKED_VOLUME;
      video.muted=false;
      video.volume=0;
      try { video.currentTime=0; } catch {}
      const playAttempt=video.play();
      if(playAttempt && typeof playAttempt.then==='function') {
        playAttempt.then(()=>{
          if(activePreview===tile)tile.classList.add('is-playing');
          else video.pause();
        }).catch(err=>{
          console.info('Interview sound was blocked by browser autoplay policy:',err);
          if(activePreview===tile)stopPreview(tile);
        });
      } else tile.classList.add('is-playing');
    }
    function stopPreview(tile=null,restoreMusic=true){
      if(!activePreview || (tile&&tile!==activePreview))return;
      const previous=activePreview;activePreview=null;
      const video=previous.querySelector('video');
      if(video){video.pause();video.muted=true;try{video.currentTime=0}catch{}}
      previous.classList.remove('is-playing');
      // Music was never paused by hover, so simply fade its volume back up.
      if(restoreMusic){
        backgroundVolumeTarget=MUSIC_VOLUME;
        resumeMusicAfterPreview=false;
      }
    }
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){heldArrows.clear();if(photoDetailOpen){e.preventDefault();closePhotoDetail();return;}if(creditsOpen){e.preventDefault();closeCredits();return;}stopPreview();return;}
      if(creditsOpen || photoDetailOpen)return;
      // The intro's ENTER key uses the same audio-permitted interaction as a click.
      if(!entered && e.key==='Enter' && !e.repeat && !e.altKey && !e.ctrlKey && !e.metaKey){
        e.preventDefault();enterExperience();return;
      }
      if(!entered||e.altKey||e.ctrlKey||e.metaKey)return;
      if(e.target?.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName||''))return;
      // Space toggles the Roses soundtrack throughout the collage.
      // If an interview is currently previewing, stop it first so audio never overlaps.
      if(e.code==='Space' || e.key===' '){
        e.preventDefault();
        if(e.repeat)return;
        if(activePreview) stopPreview();
        if(soundtrack.paused) soundtrack.play().catch(()=>{});
        else soundtrack.pause();
        return;
      }
      if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
      e.preventDefault();
      if(!heldArrows.has(e.key))move(e.key==='ArrowRight'?110:-110);
      heldArrows.add(e.key);
    });
    document.addEventListener('keyup',e=>{heldArrows.delete(e.key);});
    window.addEventListener('blur',()=>heldArrows.clear());
    document.addEventListener('visibilitychange',()=>{if(document.hidden)heldArrows.clear();});

    // Keep the ROSES soundtrack playing continuously from the beginning after
    // each complete playthrough. The HTML loop attribute handles normal looping;
    // the ended listener is a fallback for browsers that unexpectedly end it.
    soundtrack.loop=true;
    soundtrack.addEventListener('ended',()=>{
      if(!entered)return;
      try{soundtrack.currentTime=0;}catch{}
      soundtrack.play().catch(err=>console.info('Soundtrack repeat blocked:',err));
    });
    soundtrack.volume=MUSIC_VOLUME;
    function enterExperience(){
      if(entered)return;
      entered=true;
      // Stop the official engine and withdraw its roots during the entry fade
      try { rhizoma?.stop?.();rhizoma?.release?.({seconds:.8})?.catch?.(()=>{}); } catch {}
      experience.inert=false;experience.classList.add('visible');
      entry.classList.add('leaving');
      // Synchronous from click/Enter so the browser allows soundtrack audio.
      soundtrack.play().catch(err=>console.info('Audio did not start:',err));
      placeVisible();
      viewport.focus({preventScroll:true});
      setTimeout(()=>{entry.hidden=true;rhizoma?.remove?.();},1000);
    }
    enter.addEventListener('click',enterExperience);
    let pendingResize;
    addEventListener('resize',()=>{
      clearTimeout(pendingResize);pendingResize=setTimeout(()=>{
        layout();
      },120);
    });
    layout();requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
